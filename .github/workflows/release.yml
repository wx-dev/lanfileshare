name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（如 v1.0.0），需与 tauri.conf.json 的 version 一致'
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$APP_VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::标签 ${{ github.ref_name }} 与 tauri.conf.json 中的 version v$APP_VERSION 不一致"
            exit 1
          fi

      - name: Build frontend (dist + dist-admin)
        run: npm run build

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'LanFileShare v__VERSION__'
          releaseBody: |
            局域网文件分享工具 v__VERSION__

            - Windows：`.msi`（MSI 安装包）/ `.exe`（NSIS 安装包）
            - Linux：`.AppImage`（免安装）/ `.deb`（Debian / Ubuntu）
          releaseDraft: true
          prerelease: false
