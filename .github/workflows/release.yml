name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（如 v1.0.0），需与 tauri.conf.json 的 version 一致'
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles deb,rpm,appimage'
          - platform: windows-latest
            args: '--bundles msi,nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$APP_VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::标签 ${{ github.ref_name }} 与 tauri.conf.json 中的 version v$APP_VERSION 不一致"
            exit 1
          fi

      - name: Build frontend (dist + dist-admin)
        run: npm run build

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'LanFileShare v__VERSION__'
          releaseBody: |
            局域网文件分享工具 v__VERSION__

            - Windows：`.msi`（MSI 安装包）/ `.exe`（NSIS 安装包）
            - Linux：`.AppImage`（免安装）/ `.deb`（Debian / Ubuntu）/ `.rpm`（Fedora / RHEL / openSUSE）
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify rpm dependencies on Fedora
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -eu
          ls -l src-tauri/target/release/bundle/rpm/*.rpm
          docker run --rm \
            -v "$PWD/src-tauri/target/release/bundle/rpm:/rpms:ro" \
            fedora:latest bash -eu -c '
              dnf install -y --setopt=install_weak_deps=False /rpms/*.rpm
              echo "===== RPM 声明的依赖 ====="
              rpm -qpR /rpms/*.rpm
              PKG=$(rpm -qp --qf "%{NAME}" /rpms/*.rpm)
              BIN=$(rpm -ql "$PKG" | grep "^/usr/bin/" | head -n1 || true)
              if [ -z "$BIN" ] || [ ! -x "$BIN" ]; then
                echo "::error::安装后未在 /usr/bin 下找到可执行文件"
                rpm -ql "$PKG"
                exit 1
              fi
              echo "===== 可执行文件：$BIN ====="
              MISSING=$(ldd "$BIN" | grep "not found" || true)
              if [ -n "$MISSING" ]; then
                echo "::error::rpm 存在未解析的动态库，请补充 bundle.linux.rpm.depends"
                echo "$MISSING"
                exit 1
              fi
              echo "依赖校验通过：所有动态库均已解析"
            '
